name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build native modules
      run: npm rebuild sqlite3 --ignore-scripts=false

    - name: Sync SvelteKit
      run: npx svelte-kit sync

    - name: Run lint
      run: npm run lint

    - name: Typecheck
      run: npm run check

    - name: Build
      run: npm run build
